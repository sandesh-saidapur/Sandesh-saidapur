            fill="none" stroke="#e10600" stroke-width="2"/>
  <line x1="40" y1="160" x2="880" y2="160" stroke="#27374a" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Gauge readouts -->
  <text x="650" y="78" font-family="Menlo, Consolas, monospace" font-size="12" fill="#8a9bb0">GEAR</text>
