<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060a"/>
      <stop offset="1" stop-color="#111420"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#1c2130" stroke-width="1"/>
    </pattern>
    <linearGradient id="stripe" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#e10600" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e10600"/>
      <stop offset="1" stop-color="#e10600" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tacho" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#00d2be"/>
      <stop offset="0.7" stop-color="#ffd500"/>
      <stop offset="1" stop-color="#e10600"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)" opacity="0.45"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#stripe)"/>
  <rect x="0" y="296" width="1200" height="4" fill="url(#stripe)"/>

  <!-- Live indicator -->
  <circle cx="60" cy="42" r="6" fill="#e10600">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <text x="76" y="47" fill="#8a91a3" font-family="Menlo, Consolas, monospace" font-size="14" letter-spacing="3">LIVE · PIT WALL</text>

  <!-- Start lights -->
  <g>
    <circle cx="880" cy="42" r="12" fill="#2a0404">
      <animate attributeName="fill" values="#2a0404;#ff1e1e;#ff1e1e;#2a0404" keyTimes="0;0.1;0.8;1" dur="4s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="912" cy="42" r="12" fill="#2a0404">
      <animate attributeName="fill" values="#2a0404;#ff1e1e;#ff1e1e;#2a0404" keyTimes="0;0.1;0.8;1" dur="4s" begin="0.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="944" cy="42" r="12" fill="#2a0404">
      <animate attributeName="fill" values="#2a0404;#ff1e1e;#ff1e1e;#2a0404" keyTimes="0;0.1;0.8;1" dur="4s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="976" cy="42" r="12" fill="#2a0404">
      <animate attributeName="fill" values="#2a0404;#ff1e1e;#ff1e1e;#2a0404" keyTimes="0;0.1;0.8;1" dur="4s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1008" cy="42" r="12" fill="#2a0404">
      <animate attributeName="fill" values="#2a0404;#ff1e1e;#ff1e1e;#2a0404" keyTimes="0;0.1;0.8;1" dur="4s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Name and role -->
  <text x="60" y="140" fill="#ffffff" font-family="Arial Black, Impact, Helvetica, sans-serif" font-size="68" font-weight="900" letter-spacing="2">SANDESH SAIDAPUR</text>
  <text x="62" y="186" fill="#00d2be" font-family="Menlo, Consolas, monospace" font-size="22" letter-spacing="2">DATA &amp; MODEL ENGINEER · AI × DATA SCIENCE</text>
  <text x="62" y="218" fill="#8a91a3" font-family="Menlo, Consolas, monospace" font-size="16" letter-spacing="1">SECTOR 1 AI · SECTOR 2 DATA · SECTOR 3 SECURITY</text>

  <!-- Rev bar -->
  <rect x="62" y="236" width="520" height="8" rx="4" fill="#1c2130"/>
  <rect x="62" y="236" width="520" height="8" rx="4" fill="url(#tacho)">
    <animate attributeName="width" values="300;520;380;520;300" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Telemetry traces -->
  <path d="M600 110 C 660 70, 700 150, 760 110 S 860 70, 920 120 S 1040 160, 1140 100" fill="none" stroke="#e10600" stroke-width="3" stroke-linecap="round" stroke-dasharray="22 12">
    <animate attributeName="stroke-dashoffset" values="0;-340" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M600 150 C 650 190, 720 120, 790 160 S 900 200, 960 150 S 1080 120, 1140 165" fill="none" stroke="#00d2be" stroke-width="3" stroke-linecap="round" stroke-dasharray="16 14">
    <animate attributeName="stroke-dashoffset" values="0;-300" dur="2.4s" repeatCount="indefinite"/>
  </path>
  <path d="M600 200 L650 200 L675 180 L700 225 L735 190 L770 196 L795 170 L830 215 L870 185 L905 192 L930 172 L970 222 L1010 188 L1045 196 L1075 178 L1140 200" fill="none" stroke="#ffd500" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="30 10">
    <animate attributeName="stroke-dashoffset" values="0;-400" dur="4s" repeatCount="indefinite"/>
  </path>
  <text x="600" y="262" fill="#8a91a3" font-family="Menlo, Consolas, monospace" font-size="13" letter-spacing="2">LAP 01 · TELEMETRY STREAM</text>
</svg>
