  <text x="40" y="100" font-family="Helvetica, Arial, sans-serif" font-size="46" font-weight="bold" fill="#f2f5f8">SANDESH SAIDAPUR</text>
  <text x="42" y="132" font-family="Menlo, Consolas, monospace" font-size="15" fill="#00d2be">DATA &amp; MODEL ENGINEER · AI  |  CYBERSECURITY BACKGROUND</text>

  <!-- Telemetry traces -->
  <polyline points="40,190 110,176 170,182 230,160 290,168 350,140 410,152 470,128 530,142 590,118 650,136 710,112 770,130 830,108 880,122"
